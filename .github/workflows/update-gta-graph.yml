name: Update GTA Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Run once a day at midnight
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate GTA Graph SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: python .github/scripts/generate_gta_graph.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/gta_contribution.svg
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: auto-update contribution graph [skip ci]"
          git push
