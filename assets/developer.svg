<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">
  <style>
    .bg { fill: #000000; }
    .screen { fill: #0a0a0a; stroke: #333333; stroke-width: 2; }
    .text { fill: #ffffff; font-family: 'Courier New', Courier, monospace; font-size: 10px; }
    .cursor { fill: #ffffff; animation: blink 1s step-end infinite; }
    @keyframes blink { 
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
  <rect class="screen" x="10" y="10" width="100" height="60" rx="4"/>
  <rect fill="#333333" x="45" y="70" width="30" height="10"/>
  <rect fill="#333333" x="35" y="80" width="50" height="5" rx="2"/>
  <text class="text" x="18" y="28">&gt; dev_mode</text>
  <text class="text" x="18" y="44">&gt; building</text>
  <text class="text" x="18" y="60">&gt; <tspan class="cursor">_</tspan></text>
</svg>

